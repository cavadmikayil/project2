# Asılılıqların təhlükəsizlik yeniləmələri — Dependabot həftədə bir dəfə PR açır.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /_dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
