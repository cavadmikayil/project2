# Həftədə bir dəfə xarici linkləri (Faydalı Linklər, mənbələr) yoxlayır.
# Xarici saytlar müvəqqəti əlçatmaz ola bilər, ona görə bu yoxlama dərci bloklamır — yalnız xəbər verir.
name: Xarici linklər

on:
  schedule:
    - cron: '17 6 * * 1'   # hər bazar ertəsi 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xarici linkləri yoxla
        run: python3 _dev/build.py links --external
