<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şəbəkə və IT Dərs Portalı</title>
    <meta name="description" content="Cisco, şəbəkə və IT infrastrukturu üzrə interaktiv dərs vəsaitləri toplusu.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .hero {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
        }
        .portal-card {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .portal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -4px rgb(0 0 0 / 0.15);
        }
        .portal-icon {
            font-size: 2.25rem;
            line-height: 1;
        }
        .portal-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            background-color: #eef2ff;
            color: #4338ca;
        }
        body.dark-mode .portal-tag {
            background-color: #334155 !important;
            color: #c7d2fe !important;
        }
        body.dark-mode .hero {
            background: linear-gradient(135deg, #1e293b 0%, #312e81 100%);
        }
    </style>
</head>
<body class="antialiased">

    <header class="hero text-white">
        <nav class="container mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🎓</span>
                <span class="text-xl font-bold">Şəbəkə & IT Dərs Portalı</span>
            </div>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Tema dəyiş">🌙</button>
        </nav>
        <div class="container mx-auto px-6 pb-14 pt-6 text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4">Cisco və Şəbəkə Dərs Vəsaitləri</h1>
            <p class="max-w-2xl mx-auto text-blue-100 text-lg mb-8">
                Şəbəkə mühəndisliyi mövzularını interaktiv dərslər, praktiki əmrlər və vizual materiallarla öyrənin.
            </p>
            <div class="max-w-xl mx-auto">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Mövzu axtar... (məs: VLAN, DHCP, routing)"
                    class="w-full p-4 rounded-xl border-0 shadow-lg focus:ring-4 focus:ring-blue-300 text-gray-800"
                >
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Kartlar JS ilə doldurulur -->
        </div>
        <p id="no-results" class="hidden text-center text-gray-500 mt-10">Uyğun mövzu tapılmadı.</p>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 mt-8">
        <div class="container mx-auto px-6 text-center text-gray-500">
            <p class="mb-2">Yeni mövzular tezliklə əlavə olunacaq.</p>
            <a href="https://www.cavadmikayil.com" target="_blank" class="text-blue-600 hover:underline font-semibold text-lg">www.cavadmikayil.com</a>
        </div>
    </footer>

    <script>
        const lessons = [
            {
                title: 'CDP və LLDP',
                desc: 'Şəbəkə kəşf protokolları: qonşu cihazların avtomatik tanınması və konfiqurasiyası.',
                icon: '🔗',
                tag: 'Switching',
                href: 'lessons/cdp-lldp.html'
            },
            {
                title: 'VLAN, Trunking və DTP',
                desc: 'Access portlar, VLAN trunking, 802.1Q və Dynamic Trunking Protocol modları.',
                icon: '🔀',
                tag: 'Switching',
                href: 'lessons/dtp.html'
            },
            {
                title: 'DHCP Snooping',
                desc: 'DHCP spoofing hücumlarından qorunma, trusted/untrusted portlar və errdisable bərpası.',
                icon: '🛡️',
                tag: 'Security',
                href: 'lessons/dhcp-snooping.html'
            },
            {
                title: 'Marşrutlaşdırma Protokolları',
                desc: 'RIP, OSPF və EIGRP-nin inzibati məsafə, metrika və konvergensiya müqayisəsi.',
                icon: '🗺️',
                tag: 'Routing',
                href: 'lessons/dynamic-routing.html'
            },
            {
                title: 'Power Supply',
                desc: 'Volt, Amper, Watt əsasları, generator, UPS və stabilizator seçimi.',
                icon: '⚡',
                tag: 'Hardware',
                href: 'lessons/power-supply.html'
            },
            {
                title: 'Cisco IOS Əmrləri',
                desc: 'Kateqoriyalara bölünmüş, axtarıla bilən və kopyalana bilən əmrlər toplusu.',
                icon: '💻',
                tag: 'Reference',
                href: 'lessons/cisco-commands.html'
            },
            {
                title: 'Spanning Tree Protocol (STP)',
                desc: 'Port rolları, port vəziyyətləri, PVST+/Rapid-PVST+/MSTP və PortFast/BPDU Guard.',
                icon: '🌳',
                tag: 'Switching',
                href: 'lessons/stp.html'
            },
            {
                title: 'Access Control Lists (ACL)',
                desc: 'Standart/genişləndirilmiş/named ACL-lər, wildcard mask və trafik filterləmə.',
                icon: '🚧',
                tag: 'Security',
                href: 'lessons/acl.html'
            },
            {
                title: 'NAT / PAT',
                desc: 'Static NAT, Dynamic NAT və PAT (Overload) — konfiqurasiya və doğrulama.',
                icon: '🔁',
                tag: 'Routing',
                href: 'lessons/nat.html'
            },
            {
                title: 'Port Security',
                desc: 'Violation rejimləri (Protect/Restrict/Shutdown), sticky MAC və errdisable bərpası.',
                icon: '🔐',
                tag: 'Security',
                href: 'lessons/port-security.html'
            },
            {
                title: 'VTP',
                desc: 'Server/Client/Transparent modları, pruning və təhlükəli revision nömrəsi tələsi.',
                icon: '📡',
                tag: 'Switching',
                href: 'lessons/vtp.html'
            },
            {
                title: 'HSRP və VRRP (FHRP)',
                desc: 'Defolt qapı ehtiyatlaşdırması: Active/Standby, Master/Backup, preempt və prioritet.',
                icon: '🧭',
                tag: 'Routing',
                href: 'lessons/fhrp.html'
            }
        ];

        const grid = document.getElementById('card-grid');
        const noResults = document.getElementById('no-results');
        const searchInput = document.getElementById('search-input');

        function render(filterText = '') {
            const term = filterText.trim().toLowerCase();
            const filtered = lessons.filter(l =>
                l.title.toLowerCase().includes(term) ||
                l.desc.toLowerCase().includes(term) ||
                l.tag.toLowerCase().includes(term)
            );

            grid.innerHTML = filtered.map(l => `
                <a href="${l.href}" class="portal-card p-6 no-underline text-inherit">
                    <div class="flex items-center justify-between mb-4">
                        <span class="portal-icon">${l.icon}</span>
                        <span class="portal-tag">${l.tag}</span>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">${l.title}</h3>
                    <p class="text-gray-600 text-sm flex-1">${l.desc}</p>
                    <span class="mt-4 font-semibold text-blue-600">Dərsə bax →</span>
                </a>
            `).join('');

            noResults.classList.toggle('hidden', filtered.length !== 0);
        }

        searchInput.addEventListener('input', () => render(searchInput.value));
        render();
    </script>
    <script src="assets/theme.js"></script>
</body>
</html>
